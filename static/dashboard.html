<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Homelab Orchestrator - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body, html { width: 100%; height: 100%; margin: 0; padding: 0; background: #020617; color: #f8fafc; font-family: sans-serif; overflow: hidden; }</style>
</head>
<body class="flex flex-col h-screen">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 shadow-md flex justify-between items-center z-10 shrink-0">
        <div>
            <h1 class="text-lg font-bold">Homelab Orchestrator</h1>
            <p class="text-xs text-slate-400">Live agent discovery canvas</p>
        </div>
        <button onclick="localStorage.removeItem('homelab_auth'); window.location.href='/'" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded transition text-slate-300">
            Sign Out
        </button>
    </header>

    <!-- Main Workspace Layout -->
    <div class="flex flex-grow w-full h-full overflow-hidden relative">
        
        <!-- Sidebar Controls -->
        <aside class="w-80 bg-slate-900 border-r border-slate-800 p-5 flex flex-col gap-5 z-10 shadow-xl shrink-0">
            <div>
                <h2 class="text-sm font-semibold text-slate-200 uppercase tracking-wider mb-1">Add Node Manually</h2>
                <p class="text-xs text-slate-400">Spawn custom nodes or let agents check in automatically.</p>
            </div>

            <!-- Manual Node Form -->
            <form onsubmit="handleManualSpawn(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Node Name</label>
                    <input type="text" id="manual-name" placeholder="e.g. Media Server" required
                        class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">IP Address</label>
                    <input type="text" id="manual-ip" placeholder="e.g. 192.168.1.150" required
                        class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
                </div>
                <button type="submit" 
                    class="w-full bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium py-2 rounded transition shadow">
                    Spawn on Canvas
                </button>
            </form>

            <div class="border-t border-slate-800 pt-3">
                <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Active Node Registry</h3>
                <div id="node-list" class="flex flex-col gap-2 overflow-y-auto max-h-48">
                    <!-- Populated dynamically -->
                </div>
            </div>

            <div class="mt-auto text-xs text-slate-500">
                <p>💡 Tip: Click and drag any node card across the grid.</p>
            </div>
        </aside>

        <!-- Canvas Container -->
        <main id="canvas-container" class="flex-grow h-full relative bg-slate-950 flex items-center justify-center overflow-auto">
            <div id="canvas-nodes" class="relative w-[1400px] h-[1000px] bg-[radial-gradient(#1e293b_1px,transparent_1px)] [background-size:24px_24px]">


    <!-- Script: Drag Mechanics & Agent Polling -->
    <script>
        if (localStorage.getItem("homelab_auth") !== "true") {
            window.location.href = "/";
        }

        const knownNodes = new Set(['nas-1']);

        // --- Smooth Drag Mechanics ---
        let activeCard = null;
        let startX = 0;
        let startY = 0;
        let initialLeft = 0;
        let initialTop = 0;

        document.addEventListener('mousedown', (e) => {
            const card = e.target.closest('.node-card');
            if (!card) return;
            
            activeCard = card;
            startX = e.clientX;
            startY = e.clientY;
            initialLeft = parseInt(card.style.left || 0, 10);
            initialTop = parseInt(card.style.top || 0, 10);
            
            activeCard.style.zIndex = 1000;
            e.preventDefault();
        });

        document.addEventListener('mousemove', (e) => {
            if (!activeCard) return;
            
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            
            activeCard.style.left = `${initialLeft + dx}px`;
            activeCard.style.top = `${initialTop + dy}px`;
        });

        document.addEventListener('mouseup', () => {
            if (activeCard) {
                activeCard.style.zIndex = 'auto';
                const nodeId = activeCard.getAttribute('data-node-id');
                const finalX = parseInt(activeCard.style.left, 10);
                const finalY = parseInt(activeCard.style.top, 10);

                // --- ADD THIS FETCH CALL ---
                fetch('/api/nodes/position', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: nodeId, x: finalX, y: finalY })
                }).catch(err => console.error("Failed to save position:", err));
                // ---------------------------

                activeCard = null;
            }
        });

        // --- Spawn Helper ---
        function spawnNodeElement(nodeId, name, ip_address, isAgent = true) {
            if (knownNodes.has(nodeId)) return;
            knownNodes.add(nodeId);

            const canvas = document.getElementById('canvas-nodes');
            const nodeEl = document.createElement('div');
            nodeEl.className = `absolute bg-slate-900 border ${isAgent ? 'border-emerald-500/50' : 'border-indigo-500/50'} p-4 rounded-xl shadow-2xl w-56 cursor-move select-none node-card`;
            
            // Random offset spread
            const randomX = 350 + (Math.random() * 400);
            const randomY = 150 + (Math.random() * 400);
            nodeEl.style.left = `${randomX}px`;
            nodeEl.style.top = `${randomY}px`;
            nodeEl.setAttribute('data-node-id', nodeId);
            
            nodeEl.innerHTML = `
                <div class="flex items-center justify-between mb-2">
                    <span class="text-xs font-bold ${isAgent ? 'text-emerald-400' : 'text-indigo-400'} uppercase tracking-wider">${isAgent ? 'Agent Node' : 'Manual Node'}</span>
                    <span class="w-2 h-2 rounded-full ${info.status === 'Online' ? 'bg-emerald-500 animate-pulse' : 'bg-slate-600'}"></span>
                </div>
                <p class="text-sm font-semibold text-white">${name}</p>
                <p class="text-xs text-slate-400 font-mono mt-0.5">${ip_address}</p>
            `;
            
            canvas.appendChild(nodeEl);
        }

        async function handleManualSpawn(e) {
            e.preventDefault();
            const name = document.getElementById('manual-name').value;
            const ip = document.getElementById('manual-ip').value;
            const id = 'manual-' + Date.now();

            // --- REPLACE WITH THIS ---
            try {
                await fetch('/api/nodes/manual', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ node_id: id, name: name, ip_address: ip })
                });

                document.getElementById('manual-name').value = '';
                document.getElementById('manual-ip').value = '';
                pollNodes(); // Refresh immediately
            } catch (err) {
                console.error("Failed to save manual node:", err);
            }
            // -------------------------
        }

        // --- Agent Polling ---
       // --- REPLACE pollAgents WITH pollNodes ---
        async function pollNodes() {
            try {
                let res = await fetch('/api/nodes');
                let nodes = await res.json();
                
                const nodeList = document.getElementById('node-list');
                let sidebarHtml = '';

                for (const [nodeId, info] of Object.entries(nodes)) {
                    const isAgent = info.node_type === 'agent';
                    sidebarHtml += `
                        <div class="p-2.5 bg-slate-950 border border-slate-800 rounded-lg text-xs">
                            <p class="font-semibold ${isAgent ? 'text-emerald-400' : 'text-indigo-400'}">${info.name}</p>
                            <p class="text-slate-400">${info.ip_address}</p>
                        </div>
                    `;

                    // Helper to create or update node element position on the canvas
                    renderNode(nodeId, info);
                }

                nodeList.innerHTML = sidebarHtml;
            } catch (err) {
                console.error("Polling error:", err);
            }
        }
	


	async function removeNode(nodeId, event) {
            event.stopPropagation(); // Prevent drag event from triggering
            if (!confirm("Are you sure you want to remove this node?")) return;

            try {
                let res = await fetch(`/api/nodes/${nodeId}`, {
                    method: 'DELETE'
                });
                
                if (res.ok) {
                    const el = document.getElementById(`node-${nodeId}`);
                    if (el) el.remove();
                }
            } catch (err) {
                console.error("Failed to delete node:", err);
            }
        }

	

	// Function to fetch nodes from the orchestrator and update the canvas
async function pollDashboard() {
    try {
        const response = await fetch('/api/nodes');
        if (!response.ok) return;
        
        const nodes = await response.json();
        
        // Update your local nodes array or state object
        // (Replace `nodesData` and `drawCanvas()` with whatever names your script uses)
        nodesData = nodes; 
        
        // Redraw the canvas to show new positions, statuses, or new nodes
        drawCanvas(); 
    } catch (error) {
        console.error("Failed to poll nodes:", error);
    }
}

// Poll every 3 seconds (3000 milliseconds)
setInterval(pollDashboard, 3000);

// Also run it once immediately when the page loads
pollDashboard();
	


        // Make sure your renderNode helper exists in your script
        function renderNode(nodeId, info) {
            const canvas = document.getElementById('canvas-nodes');
            let nodeEl = document.getElementById(`node-${nodeId}`);
            const isAgent = info.node_type === 'agent';

            if (!nodeEl) {
                nodeEl = document.createElement('div');
                nodeEl.id = `node-${nodeId}`;
                nodeEl.className = `absolute bg-slate-900 border ${isAgent ? 'border-emerald-500/50' : 'border-indigo-500/50'} p-4 rounded-xl shadow-2xl w-56 cursor-move select-none node-card`;
                nodeEl.style.left = `${info.x}px`;
                nodeEl.style.top = `${info.y}px`;
                nodeEl.setAttribute('data-node-id', nodeId);
                
                nodeEl.innerHTML = `
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs font-bold ${isAgent ? 'text-emerald-400' : 'text-indigo-400'} uppercase tracking-wider">${isAgent ? 'Agent Node' : 'Manual Node'}</span>
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
			<button onclick="removeNode('${nodeId}', event)" class="text-slate-500 hover:text-red-400 font-bold px-1 text-xs transition" title="Delete Node">×</button>
                    </div>
                    <p class="text-sm font-semibold text-white">${info.name}</p>
                    <p class="text-xs text-slate-400 font-mono mt-0.5">${info.ip_address}</p>
                `;
                canvas.appendChild(nodeEl);
            } else if (activeCard !== nodeEl) {
                nodeEl.style.left = `${info.x}px`;
                nodeEl.style.top = `${info.y}px`;
		nodeEl.querySelector('.rounded-full').className = `w-2 h-2 rounded-full ${info.status === 'Online' ? 'bg-emerald-500 animate-pulse' : 'bg-slate-600'}`;
            }
        }

        // Change your interval call at the bottom from pollAgents to pollNodes
        setInterval(pollNodes, 3000);
        pollNodes();
    </script>
</body>
</html>
